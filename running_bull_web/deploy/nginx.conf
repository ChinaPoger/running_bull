# /etc/nginx/sites-available/bull.lingecho.com
# 前端静态文件由 nginx 直接提供；/api/ 反代到本机 3000 端口的后端
server {
    listen 80;
    server_name bull.lingecho.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bull.lingecho.com;

    # certbot 会自动填这两行：sudo certbot --nginx -d bull.lingecho.com
    ssl_certificate     /etc/letsencrypt/live/bull.lingecho.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bull.lingecho.com/privkey.pem;

    root /opt/running_bull_web/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # /?invite=XXX 也落到 index.html
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
}
